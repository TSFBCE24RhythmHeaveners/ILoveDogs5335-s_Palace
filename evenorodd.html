<html>
  <title>Even Or Odd - ILoveDogs5335's World</title>
  <div style="text-align: center; color: #9999ff; background-color: crimson; border: 5px solid firebrick; text-shadow: 2px 2px 2px #6666cc">
    <h1>Even Or Odd?</h1>
    <section> <a target="_blank" target="_self" href="https://ilovedogs5335.vercel.app"> <- Back to Main </a><a target="_blank" target="_self" href="https://ilovedogs5335.vercel.app"> <- Back to Experiments </a><br></section>
    <p>This tool checks if the number is even or odd.</p>
    <button onclick="evenorodd()">Do it!</button>
    <script>
      var number;
      function evenorodd() {
        number = Math.round(Number(window.prompt('Enter a number.')));
        if (number % 2 == 0) {
          window.alert(['The number ', number, ' is even.'].join(''));
        } else if (number % 2 == 1) {
          window.alert(['The number ', number, ' is odd.'].join(''));
        }
      }
    </script>
  </div>
</html>
